# ==============================================================================
# Reminder App — Конфігурація Git Pre-commit хуків
# ==============================================================================
default_language_version:
  python: python3.12

exclude: ^(docs/|example_backend/)

repos:
  # ----------------------------------------------------------------------------
  # 1. Базові санітарні перевірки файлів
  # ----------------------------------------------------------------------------
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        args: [--unsafe]
      - id: check-added-large-files
        args: ['--maxkb=1000']
      - id: check-merge-conflict

  # ----------------------------------------------------------------------------
  # 2. Локальні перевірки коду бекенду через інструменти uv (Ruff та Mypy)
  # ----------------------------------------------------------------------------
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check (backend)
        entry: uv run --directory backend ruff check --fix
        language: system
        types: [python]
        files: ^backend/
        pass_filenames: false

      - id: ruff-format
        name: ruff format (backend)
        entry: uv run --directory backend ruff format
        language: system
        types: [python]
        files: ^backend/
        pass_filenames: false

      - id: mypy
        name: mypy type check (backend)
        entry: uv run --directory backend mypy src
        language: system
        types: [python]
        files: ^backend/
        pass_filenames: false
