# ==============================================================================
# Reminder App — Специфікація Docker Compose (Оркестрація сервісів)
# ==============================================================================

services:

  # ----------------------------------------------------------------------------
  # 1. Реляційна база даних PostgreSQL 16+
  # ----------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: reminder_postgres
    restart: unless-stopped
    shm_size: 256mb
    environment:
      POSTGRES_USER: ${APP_CONFIG__DB__USER:-reminder_user}
      POSTGRES_PASSWORD: ${APP_CONFIG__DB__PASSWORD:-reminder_secret_password}
      POSTGRES_DB: ${APP_CONFIG__DB__NAME:-reminder_app}
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --lc-collate=C --lc-ctype=C"
    ports:
      - "127.0.0.1:${DB_HOST_PORT:-5434}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backups:/backups:z
    deploy:
      resources:
        limits:
          memory: 512M
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${APP_CONFIG__DB__USER:-reminder_user} -d ${APP_CONFIG__DB__NAME:-reminder_app}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - reminder_network

  # ----------------------------------------------------------------------------
  # 2. Періодичне резервне копіювання PostgreSQL (щоденний крон о 02:00)
  # ----------------------------------------------------------------------------
  db_backup:
    image: postgres:16-alpine
    container_name: reminder_db_backup
    restart: unless-stopped
    env_file:
      - .env
    environment:
      APP_CONFIG__DB__HOST: postgres
      APP_CONFIG__DB__PORT: 5432
      BACKUPS_DIR: /backups
    volumes:
      - ./backups:/backups:z
      - ./logs/backups:/var/log/backups:z
      - ./scripts/pg_backup_rotated.sh:/pg_backup_rotated.sh:ro,z
    entrypoint: ["/bin/sh", "-c", "export -p > /etc/environment && mkdir -p /var/log/backups && echo \"0 2 * * * /bin/sh /pg_backup_rotated.sh >> /var/log/backups/backup.log 2>&1\" | crontab - && crond -f -l 2"]
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - reminder_network

  # ----------------------------------------------------------------------------
  # 3. Redis 7+ (Кеш, черги сповіщень та фонових завдань ARQ)
  # ----------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: reminder_redis
    restart: unless-stopped
    environment:
      REDISCLI_AUTH: ${APP_CONFIG__REDIS__PASSWORD:-reminder_redis_password}
    command: >
      --requirepass ${APP_CONFIG__REDIS__PASSWORD:-reminder_redis_password}
      --maxmemory 256mb
      --maxmemory-policy volatile-lru
      --save 60 1
    ports:
      - "127.0.0.1:${APP_CONFIG__REDIS__PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 300M
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${APP_CONFIG__REDIS__PASSWORD:-reminder_redis_password}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - reminder_network

  # ----------------------------------------------------------------------------
  # 4. Одноразовий сервіс міграцій та початкового сідування (Alembic + Seed)
  # ----------------------------------------------------------------------------
  migrator:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: reminder_migrator
    restart: "no"
    command: ["sh", "-c", "alembic upgrade head && python scripts/seed_superadmin.py"]
    env_file:
      - .env
    environment:
      APP_CONFIG__DB__HOST: postgres
      APP_CONFIG__DB__PORT: 5432
      APP_CONFIG__REDIS__HOST: redis
      APP_CONFIG__REDIS__PORT: 6379
    volumes:
      - ./backend/alembic:/app/alembic:ro,z
      - ./backend/scripts:/app/scripts:ro,z
      - ./backend/src:/app/src:ro,z
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - reminder_network

  # ----------------------------------------------------------------------------
  # 5. REST API сервіс (FastAPI + Uvicorn)
  # ----------------------------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: reminder_backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      APP_CONFIG__DB__HOST: postgres
      APP_CONFIG__DB__PORT: 5432
      APP_CONFIG__REDIS__HOST: redis
      APP_CONFIG__REDIS__PORT: 6379
      APP_CONFIG__LOG__DIR: /logs
    volumes:
      - ./backend:/app:z
      - /app/.venv
      - ./logs:/logs:z
    ports:
      - "127.0.0.1:${BACKEND_HOST_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      migrator:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 512M
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8000/api/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - reminder_network

  # ----------------------------------------------------------------------------
  # 6. Фоновий асинхронний воркер та Cron-шедулер (ARQ)
  # ----------------------------------------------------------------------------
  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: reminder_worker
    restart: unless-stopped
    command: ["python", "-m", "arq", "src.tasks.worker.WorkerSettings"]
    env_file:
      - .env
    environment:
      APP_CONFIG__DB__HOST: postgres
      APP_CONFIG__DB__PORT: 5432
      APP_CONFIG__REDIS__HOST: redis
      APP_CONFIG__REDIS__PORT: 6379
      APP_CONFIG__LOG__DIR: /logs
    volumes:
      - ./backend:/app:z
      - /app/.venv
      - ./logs:/logs:z
    depends_on:
      postgres:
        condition: service_healthy
      migrator:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 384M
    networks:
      - reminder_network

  # ----------------------------------------------------------------------------
  # 7. Сервіс Telegram-бота (aiogram 3.x Long Polling + Redis Consumer)
  # ----------------------------------------------------------------------------
  bot:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: reminder_bot
    restart: unless-stopped
    command: ["python", "-m", "src.bot.main"]
    env_file:
      - .env
    environment:
      APP_CONFIG__DB__HOST: postgres
      APP_CONFIG__DB__PORT: 5432
      APP_CONFIG__REDIS__HOST: redis
      APP_CONFIG__REDIS__PORT: 6379
      APP_CONFIG__LOG__DIR: /logs
    volumes:
      - ./backend:/app:z
      - /app/.venv
      - ./logs:/logs:z
    depends_on:
      postgres:
        condition: service_healthy
      migrator:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 256M
    networks:
      - reminder_network

# ------------------------------------------------------------------------------
# Спільні томи даних (Volumes)
# ------------------------------------------------------------------------------
volumes:
  postgres_data:
  redis_data:

# ------------------------------------------------------------------------------
# Ізольована мережа сервісів (Networks)
# ------------------------------------------------------------------------------
networks:
  reminder_network:
    driver: bridge
